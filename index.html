<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKS CI/CD Lab - Version 1</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 40px;
      max-width: 560px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">VERSION 1.0</span>
    <h1>Hello from Amazon EKS!</h1>
    <p>Deployed automatically via <strong>GitHub + AWS CodePipeline + AWS CodeBuild + Amazon ECR</strong>.</p>
  </div>
</body>
</html>
